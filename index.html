<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>Museum Web Game</title>
    
    <!-- ========== PWA 設定 ========== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Museum Game">
    <link rel="apple-touch-icon" href="assets/icons/icon-256.png">
    
    <!-- ========== CSS ========== -->
    <link rel="stylesheet" href="style.css?v=52">
    <link rel="stylesheet" href="css/station-demo-game.css?v=65">
    <link rel="stylesheet" href="css/cake-station-game.css?v=51">
</head>
<body>
    <div id="game-wrapper">
        <!-- 新增 Loading 畫面 -->
        <div id="loading-screen" style="display: none;">
            <div class="loading-content">
                <div class="spinner"></div>
                <p><span data-i18n="loading.text">資源加載中...</span> <span id="loading-progress">0</span>%</p>
            </div>
        </div>

        <!-- 新增：年齡選擇視窗 - 層級比標題畫面高，但比旋轉提示低 -->
        <div id="age-select-dialog" class="age-dialog">
            <div class="age-dialog-content">
                <h2 data-i18n="age.title">選擇遊戲模式</h2>
                <p class="age-subtitle" data-i18n="age.subtitle">請選擇適合您的版本</p>
                <div class="age-buttons">
                    <button id="age-child" class="age-btn child-btn">
                        <span class="age-icon">🧒</span>
                        <span class="age-text" data-i18n="age.child.text">小朋友版</span>
                        <span class="age-desc" data-i18n="age.child.desc">附注音・簡單引導</span>
                    </button>
                    <button id="age-adult" class="age-btn adult-btn">
                        <span class="age-icon">👤</span>
                        <span class="age-text" data-i18n="age.adult.text">一般版</span>
                        <span class="age-desc" data-i18n="age.adult.desc">標準文字・完整劇情</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 起始頁面 -->
        <div id="start-menu" class="scene">
            <!-- 背景由 CSS 控制，這裡放置 UI 元素 -->
            <div class="title-container">
                <img src="assets/images/title/title-20260904.png" data-i18n-attr="alt:title.alt" alt="森美蘭客家文化博物館・傳統日常再現" class="start-title-img">
            </div>

            <div class="menu-buttons">
                <button id="startBtn" class="time-machine-btn time-machine-btn-primary" type="button" data-i18n="menu.start">搭乘時光機</button>
                <button id="exitBtn" class="time-machine-btn" type="button" data-i18n="menu.exit">回到現實</button>
                <div class="lang-switch" role="group" aria-label="語言 Language">
                    <button type="button" class="lang-btn" data-lang="zh-Hant" lang="zh-Hant">繁體中文</button>
                    <button type="button" class="lang-btn" data-lang="zh-Hans" lang="zh-Hans">简体中文</button>
                </div>
            </div>
        </div>

        <!-- 引導說明頁 1／2：土樓旁白過場 -->
        <div id="intro" class="scene intro-scene" style="display:none;">
            <div class="intro-panel">
                <p class="intro-narration" data-i18n="intro.narration">您即將抵達 50 年前的客家土樓，爺爺奶奶家裡。請準備好愉悅的心情，開始體驗。</p>
                <div class="intro-actions">
                    <button id="introNextBtn" class="time-machine-btn time-machine-btn-primary" type="button" data-i18n="intro.next">繼續</button>
                </div>
            </div>
            <button class="back-btn intro-back" type="button" onclick="showScene('start-menu')" data-i18n="common.back">返回首頁</button>
        </div>

        <!-- 引導說明頁 2／2：爺爺奶奶一起歡迎 -->
        <div id="intro-welcome" class="scene intro-scene" style="display:none;">
            <div class="intro-hosts" aria-hidden="true">
                <img class="intro-host intro-host-grandma" src="assets/images/characters/grandma.png" alt="">
                <img class="intro-host intro-host-grandpa" src="assets/images/characters/grandpa.png" alt="">
            </div>
            <div class="intro-panel intro-welcome-panel">
                <p class="intro-narration" data-i18n="welcome.text">歡迎你呀～客人～來裡面坐～</p>
                <div class="intro-actions">
                    <button id="welcomeStartBtn" class="time-machine-btn time-machine-btn-primary" type="button" data-i18n="welcome.start">開始體驗</button>
                </div>
            </div>
            <button class="back-btn intro-back" type="button" onclick="showScene('start-menu')" data-i18n="common.back">返回首頁</button>
        </div>

        <button id="install-app-btn" class="install-app-btn" type="button" hidden data-i18n="install.label">安裝</button>

        <!-- 關卡選擇頁面 -->
        <div id="level-select" class="scene" style="display:none;">
            <h2 data-i18n="level.title">選擇遊戲入口</h2>
            <p class="level-subtitle" data-i18n="level.subtitle">請根據您的所在位置挑選您的站點</p>
            <div class="level-buttons station-entry-list has-cake-station">
                <button id="station-fire-btn" class="station-entry" type="button" data-station-demo="fire">
                    <span class="station-kicker" data-i18n="level.fire.kicker">站點 1</span>
                    <span class="station-title" data-i18n="level.fire.title">灶台生火</span>
                    <span class="station-desc" data-i18n="level.fire.desc">幫客家阿嬤燃起灶台的爐火吧！</span>
                </button>
                <button id="station-tea-btn" class="station-entry" type="button" data-station-demo="tea">
                    <span class="station-kicker" data-i18n="level.tea.kicker">站點 2</span>
                    <span class="station-title" data-i18n="level.tea.title">擂茶料理</span>
                    <span class="station-desc" data-i18n="level.tea.desc">端出一碗擂茶，這是客家人最實在的待客之道。</span>
                </button>
                <button id="station-cradle-btn" class="station-entry" type="button" data-station-demo="cradle">
                    <span class="station-kicker" data-i18n="level.cradle.kicker">站點 3</span>
                    <span class="station-title" data-i18n="level.cradle.title">搖籃哄睡</span>
                    <span class="station-desc" data-i18n="level.cradle.desc">接過阿嬤手裡的搖籃，把孩子輕輕哄進夢裡。</span>
                </button>
                <button id="station-cake-btn" class="station-entry" type="button" data-station-demo="cake">
                    <span class="station-kicker" data-i18n="level.cake.kicker">站點 4</span>
                    <span class="station-title" data-i18n="level.cake.title">粿印製作</span>
                    <span class="station-desc" data-i18n="level.cake.desc">印一個紅粿，把節慶的祝福壓進米糰裡。</span>
                </button>
                <button id="station-story-btn" class="station-entry station-entry-combined" type="button" data-station-demo="story">
                    <span class="station-kicker" data-i18n="level.story.kicker">約 10 分鐘</span>
                    <span class="station-title" data-i18n="level.story.title">完整劇情體驗</span>
                    <span class="station-desc" data-i18n="level.story.desc">跟著阿嬤阿公，完整體驗上述四項客家故事。</span>
                </button>
            </div>
            <button class="back-btn" onclick="showScene('start-menu')" data-i18n="level.back">返回首頁</button>
        </div>

        <!-- 目前站點會建立自己的互動圖層；此場景只負責隱藏入口畫面。 -->
        <div id="game-container" class="scene" style="display:none;"></div>
        
        <!-- 音效控制（隱藏） -->
        <audio id="bg-music" loop></audio>
        <audio id="sfx-player"></audio>

        <!-- 退出確認彈窗 -->
        <div id="exit-confirm-dialog" class="confirm-dialog" style="display: none;">
            <div class="confirm-dialog-content">
                <p data-i18n="exit.title">你確定要退出嗎？</p>
                <p class="warning-text" data-i18n="exit.warning">任何未儲存的進度都會遺失</p>
                <div class="confirm-dialog-buttons">
                    <button id="exit-confirm-yes" class="confirm-btn confirm-yes" data-i18n="exit.yes">確認退出</button>
                    <button id="exit-confirm-no" class="confirm-btn confirm-no" data-i18n="exit.no">繼續遊戲</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 多語系（最先載入，其他模組會用到 t()） ========== -->
    <script src="js/i18n/i18n.js?v=45"></script>
    <script src="js/i18n/zh-Hant.js?v=65"></script>
    <script src="js/i18n/zh-Hans.js?v=65"></script>

    <!-- ========== 共用系統 ========== -->
    <script src="js/core/Logger.js"></script>
    <script src="js/core/ErrorReporter.js"></script>
    <script src="js/core/LoadingManager.js"></script>
    <script src="js/core/AudioManager.js"></script>
    <script src="js/core/SceneManager.js"></script>

    <!-- ========== 現行站點資料 ========== -->
    <script src="js/data/stationCombinedStory.js?v=52"></script>
    <script src="js/data/station34CombinedStory.js?v=52"></script>
    <script src="js/data/cakePatterns.js?v=46"></script>
    <script src="js/data/combinedStoryPacing.js?v=43"></script>

    <!-- ========== 現行站點玩法 ========== -->
    <script src="js/minigames/StationIntroGuide.js?v=49"></script>
    <script src="js/minigames/EndingScreen.js?v=51"></script>
    <script src="js/minigames/CradleStationGame.js?v=52"></script>
    <script src="js/minigames/CakeStationGame.js?v=49"></script>
    <script src="js/minigames/Station34CombinedGame.js?v=52"></script>
    <script src="js/minigames/StationDemoGame.js?v=65"></script>
    
    <!-- ========== 主入口（最後載入） ========== -->
    <script src="js/main.js?v=47"></script>
    
    <!-- ========== Service Worker 註冊（PWA） ========== -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js?v=65').then(function(registration) {
                    console.log('✅ Service Worker 註冊成功，範圍:', registration.scope);
                }).catch(function(error) {
                    console.log('❌ Service Worker 註冊失敗:', error);
                });
            });
        }
    </script>
</body>
</html>
