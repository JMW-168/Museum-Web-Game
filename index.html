<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>Museum Web Game</title>
    
    <!-- ========== PWA 設定 ========== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Museum Game">
    <link rel="apple-touch-icon" href="assets/icons/icon-256.png">
    
    <!-- ========== CSS ========== -->
    <link rel="stylesheet" href="style.css?v=54">
    <link rel="stylesheet" href="css/station-demo-game.css?v=90">
    <link rel="stylesheet" href="css/cake-station-game.css?v=71">
</head>
<body>
    <div id="game-wrapper">
        <!-- 新增 Loading 畫面 -->
        <div id="loading-screen" style="display: none;">
            <div class="loading-content">
                <div class="spinner"></div>
                <p><span data-i18n="loading.text">资源加载中...</span> <span id="loading-progress">0</span>%</p>
            </div>
        </div>

        <!-- 新增：年齡選擇視窗 - 層級比標題畫面高，但比旋轉提示低 -->
        <div id="age-select-dialog" class="age-dialog">
            <div class="age-dialog-content">
                <h2 data-i18n="age.title">选择游戏模式</h2>
                <p class="age-subtitle" data-i18n="age.subtitle">请选择适合您的版本</p>
                <div class="age-buttons">
                    <button id="age-child" class="age-btn child-btn">
                        <span class="age-icon">🧒</span>
                        <span class="age-text" data-i18n="age.child.text">小朋友版</span>
                        <span class="age-desc" data-i18n="age.child.desc">附注音・简单引导</span>
                    </button>
                    <button id="age-adult" class="age-btn adult-btn">
                        <span class="age-icon">👤</span>
                        <span class="age-text" data-i18n="age.adult.text">一般版</span>
                        <span class="age-desc" data-i18n="age.adult.desc">标准文字・完整剧情</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 起始頁面 -->
        <div id="start-menu" class="scene">
            <!-- 背景由 CSS 控制，這裡放置 UI 元素 -->
            <div class="title-container">
                <img src="assets/images/title/title-20260904-simplified.png" data-i18n-attr="src:title.image,alt:title.alt" alt="森美兰客家文化博物馆・传统日常再现" class="start-title-img">
            </div>

            <div class="menu-buttons">
                <button id="startBtn" class="time-machine-btn time-machine-btn-primary" type="button" data-i18n="menu.start">搭乘时光机</button>
                <button id="exitBtn" class="time-machine-btn" type="button" data-i18n="menu.exit">回到现实</button>
                <div class="lang-switch" role="group" aria-label="語言 Language">
                    <button type="button" class="lang-btn" data-lang="zh-Hant" lang="zh-Hant">繁體中文</button>
                    <button type="button" class="lang-btn" data-lang="zh-Hans" lang="zh-Hans">简体中文</button>
                </div>
            </div>
        </div>

        <!-- 引導說明頁 1／2：土樓旁白過場 -->
        <div id="intro" class="scene intro-scene" style="display:none;">
            <div class="intro-panel">
                <p class="intro-narration" data-i18n="intro.narration">您即将降落于 50 年前的客家土楼，阿公阿嬷家里～请准备好愉悦的心情，体验即将开始～</p>
                <div class="intro-actions">
                    <button id="introNextBtn" class="time-machine-btn time-machine-btn-primary" type="button" data-i18n="intro.next">继续</button>
                </div>
            </div>
            <button class="back-btn intro-back" type="button" onclick="showScene('start-menu')" data-i18n="common.back">返回首页</button>
        </div>

        <!-- 引導說明頁 2／2：爺爺奶奶一起歡迎 -->
        <div id="intro-welcome" class="scene intro-scene" style="display:none;">
            <div class="intro-hosts" aria-hidden="true">
                <img class="intro-host intro-host-grandma" src="assets/images/characters/grandma.png" alt="">
                <img class="intro-host intro-host-grandpa" src="assets/images/characters/grandpa.png" alt="">
            </div>
            <div class="intro-panel intro-welcome-panel">
                <p class="intro-narration" data-i18n="welcome.text">欢迎你呀～来里面坐～</p>
                <div class="intro-actions">
                    <button id="welcomeStartBtn" class="time-machine-btn time-machine-btn-primary" type="button" data-i18n="welcome.start">开始体验</button>
                </div>
            </div>
            <button class="back-btn intro-back" type="button" onclick="showScene('start-menu')" data-i18n="common.back">返回首页</button>
        </div>

        <button id="install-app-btn" class="install-app-btn" type="button" hidden data-i18n="install.label">安装</button>

        <!-- 關卡選擇頁面 -->
        <div id="level-select" class="scene" style="display:none;">
            <h2 data-i18n="level.title">选择游戏入口</h2>
            <p class="level-subtitle" data-i18n="level.subtitle">请根据您的所在位置挑选您的站点</p>
            <div class="level-buttons station-entry-list has-cake-station">
                <button id="station-fire-btn" class="station-entry" type="button" data-station-demo="fire">
                    <span class="station-kicker" data-i18n="level.fire.kicker">站点 1</span>
                    <span class="station-title" data-i18n="level.fire.title">灶台生火</span>
                    <span class="station-desc" data-i18n="level.fire.desc">帮客家阿嬷燃起灶台的炉火吧！</span>
                </button>
                <button id="station-tea-btn" class="station-entry" type="button" data-station-demo="tea">
                    <span class="station-kicker" data-i18n="level.tea.kicker">站点 2</span>
                    <span class="station-title" data-i18n="level.tea.title">擂茶料理</span>
                    <span class="station-desc" data-i18n="level.tea.desc">端出一碗擂茶，这是客家人最实在的待客之道。</span>
                </button>
                <button id="station-cradle-btn" class="station-entry" type="button" data-station-demo="cradle">
                    <span class="station-kicker" data-i18n="level.cradle.kicker">站点 3</span>
                    <span class="station-title" data-i18n="level.cradle.title">摇篮哄睡</span>
                    <span class="station-desc" data-i18n="level.cradle.desc">接过阿嬷手里的摇篮，把孩子轻轻哄进梦里。</span>
                </button>
                <button id="station-cake-btn" class="station-entry" type="button" data-station-demo="cake">
                    <span class="station-kicker" data-i18n="level.cake.kicker">站点 4</span>
                    <span class="station-title" data-i18n="level.cake.title">粄印制作</span>
                    <span class="station-desc" data-i18n="level.cake.desc">印一个红粄，把衷心的祝福压进米团里。</span>
                </button>
                <button id="station-story-btn" class="station-entry station-entry-combined" type="button" data-station-demo="story">
                    <span class="station-kicker" data-i18n="level.story.kicker">约 10 分钟</span>
                    <span class="station-title" data-i18n="level.story.title">完整剧情体验</span>
                    <span class="station-desc" data-i18n="level.story.desc">跟着阿嬷阿公，完整体验上述四项客家故事。</span>
                </button>
                <a id="station-collect-btn" class="station-entry station-entry-collect" href="https://docs.google.com/forms/d/1uiZko3EHKSEQrplxtCcj6f6EU4Yiph-wJtnCdEDpwZc/viewform?pli=1&pli=1&edit_requested=true" target="_blank" rel="noopener noreferrer">
                    <span class="station-kicker" data-i18n="level.collect.kicker">征集活动</span>
                    <span class="station-title" data-i18n="level.collect.title">客家老物件征集</span>
                    <span class="station-desc" data-i18n="level.collect.desc">家里有阿公阿婆留下来的旧东西吗？粄模、揹带、花布、油灯、算盘、老照片……只要和客家生活有关，我们都想听听它的故事</span>
                </a>
            </div>
            <button class="back-btn" onclick="showScene('start-menu')" data-i18n="level.back">返回首页</button>
        </div>

        <!-- 目前站點會建立自己的互動圖層；此場景只負責隱藏入口畫面。 -->
        <div id="game-container" class="scene" style="display:none;"></div>
        
        <!-- 音效控制（隱藏） -->
        <audio id="bg-music" loop></audio>
        <audio id="sfx-player"></audio>

        <!-- 退出確認彈窗 -->
        <div id="exit-confirm-dialog" class="confirm-dialog" style="display: none;">
            <div class="confirm-dialog-content">
                <p data-i18n="exit.title">你确定要退出吗？</p>
                <p class="warning-text" data-i18n="exit.warning">任何未保存的进度都会丢失</p>
                <div class="confirm-dialog-buttons">
                    <button id="exit-confirm-yes" class="confirm-btn confirm-yes" data-i18n="exit.yes">确认退出</button>
                    <button id="exit-confirm-no" class="confirm-btn confirm-no" data-i18n="exit.no">继续游戏</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 多語系（最先載入，其他模組會用到 t()） ========== -->
    <script src="js/i18n/i18n.js?v=45"></script>
    <script src="js/i18n/zh-Hant.js?v=85"></script>
    <script src="js/i18n/zh-Hans.js?v=85"></script>

    <!-- ========== 共用系統 ========== -->
    <script src="js/core/Logger.js"></script>
    <script src="js/core/ErrorReporter.js"></script>
    <script src="js/core/LoadingManager.js"></script>
    <script src="js/core/AudioManager.js"></script>
    <script src="js/core/SceneManager.js"></script>

    <!-- ========== 現行站點資料 ========== -->
    <script src="js/data/stationCombinedStory.js?v=54"></script>
    <script src="js/data/station34CombinedStory.js?v=55"></script>
    <script src="js/data/cakePatterns.js?v=47"></script>
    <script src="js/data/combinedStoryPacing.js?v=43"></script>

    <!-- ========== 現行站點玩法 ========== -->
    <script src="js/minigames/StationIntroGuide.js?v=49"></script>
    <script src="js/minigames/EndingScreen.js?v=52"></script>
    <script src="js/minigames/CradleStationGame.js?v=55"></script>
    <script src="js/minigames/CakeStationGame.js?v=59"></script>
    <script src="js/minigames/Station34CombinedGame.js?v=61"></script>
    <script src="js/minigames/StationDemoGame.js?v=79"></script>
    
    <!-- ========== 主入口（最後載入） ========== -->
    <script src="js/main.js?v=48"></script>
    
    <!-- ========== Service Worker 註冊（PWA） ========== -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js?v=77').then(function(registration) {
                    console.log('✅ Service Worker 註冊成功，範圍:', registration.scope);
                }).catch(function(error) {
                    console.log('❌ Service Worker 註冊失敗:', error);
                });
            });
        }
    </script>
</body>
</html>
