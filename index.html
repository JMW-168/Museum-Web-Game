<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>Museum Web Game</title>
    
    <!-- ========== PWA 設定 ========== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Museum Game">
    <link rel="apple-touch-icon" href="assets/icons/icon-256.png">
    
    <!-- ========== CSS ========== -->
    <link rel="stylesheet" href="style.css?v=39">
    <link rel="stylesheet" href="css/station-demo-game.css">
    <link rel="stylesheet" href="css/cake-station-game.css?v=39">
</head>
<body>
    <div id="game-wrapper">
        <!-- 新增 Loading 畫面 -->
        <div id="loading-screen" style="display: none;">
            <div class="loading-content">
                <div class="spinner"></div>
                <p>資源加載中... <span id="loading-progress">0</span>%</p>
            </div>
        </div>

        <!-- 新增：年齡選擇視窗 - 層級比標題畫面高，但比旋轉提示低 -->
        <div id="age-select-dialog" class="age-dialog">
            <div class="age-dialog-content">
                <h2>選擇遊戲模式</h2>
                <p class="age-subtitle">請選擇適合您的版本</p>
                <div class="age-buttons">
                    <button id="age-child" class="age-btn child-btn">
                        <span class="age-icon">🧒</span>
                        <span class="age-text">小朋友版</span>
                        <span class="age-desc">附注音・簡單引導</span>
                    </button>
                    <button id="age-adult" class="age-btn adult-btn">
                        <span class="age-icon">👤</span>
                        <span class="age-text">一般版</span>
                        <span class="age-desc">標準文字・完整劇情</span>
                    </button>
                </div>  
            </div>
        </div>

        <!-- 起始頁面 -->
        <div id="start-menu" class="scene">
            <!-- 背景由 CSS 控制，這裡放置 UI 元素 -->
            <div class="title-container">
                <img src="assets/images/title/title-20260904.png" alt="森美蘭客家文化博物館・傳統日常再現" class="start-title-img">
            </div>
            
            <div class="menu-buttons">
                <button id="startBtn" class="time-machine-btn time-machine-btn-primary" type="button">搭乘時光機</button>
                <button id="exitBtn" class="time-machine-btn" type="button">回到現實</button>
            </div>
        </div>

        <button id="install-app-btn" class="install-app-btn" type="button" hidden>安裝</button>

        <!-- 關卡選擇頁面 -->
        <div id="level-select" class="scene" style="display:none;">
            <h2>選擇遊戲入口</h2>
            <div class="level-buttons station-entry-list has-cake-station">
                <button id="station-fire-btn" class="station-entry" type="button" data-station-demo="fire">
                    <span class="station-kicker">關卡一 / 站點 1</span>
                    <span class="station-title">灶台生火</span>
                    <span class="station-desc">依節拍加入柴火，控制火候條，認識葉家勤儉與生火日常。</span>
                </button>
                <button id="station-tea-btn" class="station-entry" type="button" data-station-demo="tea">
                    <span class="station-kicker">關卡二 / 站點 2</span>
                    <span class="station-title">擂茶料理</span>
                    <span class="station-desc">從流動隊列依序拖曳食材，避開柴火與石頭，完成研磨與切料。</span>
                </button>
                <button id="station-cradle-btn" class="station-entry" type="button" data-station-demo="cradle">
                    <span class="station-kicker">關卡三 / 站點 3</span>
                    <span class="station-title">搖籃哄睡</span>
                    <span class="station-desc">跟隨左右導引輕搖搖籃，慢慢累積穩定度，讓嬰孩安心睡著。</span>
                </button>
                <button id="station-cake-btn" class="station-entry" type="button" data-station-demo="cake">
                    <span class="station-kicker">關卡四 / 站點 4</span>
                    <span class="station-title">粿印製作</span>
                    <span class="station-desc">認識龜、桃、魚與連錢紋，完成拖曳配對後用四面粿印棒壓出紅粿。</span>
                </button>
                <button id="station-combined-btn" class="station-entry station-entry-combined" type="button" data-station-demo="combined">
                    <span class="station-kicker">劇情體驗</span>
                    <span class="station-title">關卡一二合併版</span>
                    <span class="station-desc">跟著阿嬤與阿公的故事，依序完成灶台生火與擂茶料理。</span>
                </button>
                <button id="station-combined-34-btn" class="station-entry station-entry-combined" type="button" data-station-demo="combined34">
                    <span class="station-kicker">劇情體驗</span>
                    <span class="station-title">三四關合併版</span>
                    <span class="station-desc">從搖籃裡的牽掛走到粿印上的祝福，依序完成搖籃哄睡與粿印製作。</span>
                </button>
            </div>
            <button class="back-btn" onclick="showScene('start-menu')">返回</button>
        </div>

        <!-- 目前站點會建立自己的互動圖層；此場景只負責隱藏入口畫面。 -->
        <div id="game-container" class="scene" style="display:none;"></div>
        
        <!-- 音效控制（隱藏） -->
        <audio id="bg-music" loop></audio>
        <audio id="sfx-player"></audio>

        <!-- 退出確認彈窗 -->
        <div id="exit-confirm-dialog" class="confirm-dialog" style="display: none;">
            <div class="confirm-dialog-content">
                <p>你確定要退出嗎？</p>
                <p class="warning-text">任何未儲存的進度都會遺失</p>
                <div class="confirm-dialog-buttons">
                    <button id="exit-confirm-yes" class="confirm-btn confirm-yes">確認退出</button>
                    <button id="exit-confirm-no" class="confirm-btn confirm-no">繼續遊戲</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 共用系統 ========== -->
    <script src="js/core/Logger.js"></script>
    <script src="js/core/ErrorReporter.js"></script>
    <script src="js/core/LoadingManager.js"></script>
    <script src="js/core/AudioManager.js"></script>
    <script src="js/core/SceneManager.js"></script>

    <!-- ========== 現行站點資料 ========== -->
    <script src="js/data/stationCombinedStory.js"></script>
    <script src="js/data/station34CombinedStory.js?v=39"></script>
    <script src="js/data/cakePatterns.js?v=39"></script>
    
    <!-- ========== 現行站點玩法 ========== -->
    <script src="js/minigames/CradleStationGame.js"></script>
    <script src="js/minigames/CakeStationGame.js?v=39"></script>
    <script src="js/minigames/Station34CombinedGame.js?v=39"></script>
    <script src="js/minigames/StationDemoGame.js"></script>
    
    <!-- ========== 主入口（最後載入） ========== -->
    <script src="js/main.js?v=39"></script>
    
    <!-- ========== Service Worker 註冊（PWA） ========== -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js?v=39').then(function(registration) {
                    console.log('✅ Service Worker 註冊成功，範圍:', registration.scope);
                }).catch(function(error) {
                    console.log('❌ Service Worker 註冊失敗:', error);
                });
            });
        }
    </script>
</body>
</html>
